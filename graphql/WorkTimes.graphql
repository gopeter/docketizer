# All of the user's work time profiles: each applies from its activeFrom until the next one starts,
# so the app picks the one for each day itself — a profile starting mid-week counts from that day.
query WorkTimes($userId: ID!) {
    users(filter: { ids: [$userId] }) {
        nodes {
            workTimes(first: 100) {
                nodes {
                    activeFrom
                    mon
                    tue
                    wed
                    thu
                    fri
                    sat
                    sun
                }
            }
        }
    }
}
