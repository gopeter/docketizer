query Viewer($date: String!) {
    viewer {
        id
        expertise {
            id
        }
        timetrackings(filter: { dates: [$date] }) {
            nodes {
                id
                duration
                ticket {
                    id
                    number
                    title
                }
                project {
                    id
                    title
                    pnr
                }
            }
        }
        recentlyTrackedTickets(count: 10) {
            id
            title
            number
            project {
                id
                title
                pnr
            }
        }
    }
}
