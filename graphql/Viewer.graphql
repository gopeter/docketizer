query Viewer($date: String!) {
    viewer {
        id
        expertise {
            id
        }
        timetrackings(filter: { dates: [$date] }) {
            nodes {
                id
                duration
                description
                ticket {
                    id
                    number
                    title
                }
                project {
                    id
                    title
                    pnr
                }
            }
        }
        recentlyTrackedTickets(count: 30) {
            id
            title
            number
            project {
                id
                title
                pnr
            }
        }
        assignedTickets(first: 30, filter: { bookable: true }) {
            nodes {
                id
                title
                number
                project {
                    id
                    title
                    pnr
                }
            }
        }
    }
}
